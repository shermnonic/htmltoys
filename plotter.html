<!doctype html>
<html lang=en>
<head><meta charset="utf-8"/>
<title>plotter</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="author" content="386dx25, mnemonic@386dx25.de"/>
<style>
body { text-align: center; }
@media (orientation: landscape) 
  { canvas { width: 100%; max-width: 1280px; aspect-ratio: 640/400; } }
@media (orientation: portrait) 
  { canvas { width: 100%; max-height: 1080px; aspect-ratio: 400/640; } }
@media (prefers-color-scheme: dark) {
  body { color: white; background: #121212; }
  canvas { filter: invert(100%); } }
</style>
</head>
<body>
<h1>plotter</h1>
<canvas width="640px" height="400px" style="border: 1px solid black"></canvas>
<p><input type="checkbox" id="lines" checked><label for="lines"> Lines</label></p>
<p id="info"></p>
<script>
// ---- Functions --------------------------------------------------------------

function calculateOneliner(a=282, w=168.87, l=6.5) {
  var pts = new Array(a);
  pts[0] = [320, 200];
  for(let i=1; i < a; ++i) {
    const theta = (w * i) * Math.PI / 180.0;
    pts[i] = [ 
      pts[i-1][0] - Math.sin(theta) * l*i,
      pts[i-1][1] - Math.cos(theta) * l*i
    ];
  }
  return pts;
}

function calculateFantasy(formula = "SIN(2*I)", steps=[4, 1], variant=0) {
  var lines = [];
  var pts = [];
  function addPoint(x, y) { pts.push([2*x, 2*y]); } // scale 320x200 to 640x400
  function emitLine() { if(pts.length > 0) { lines.push(pts); } pts = []; }

  // BASIC wrappers
  const ABS = (x) => Math.abs(x);
  const SIN = (x) => Math.sin(x);  const COS = (x) => Math.cos(x);
  const EXP = (x) => Math.exp(x);  const TAN = (x) => Math.tan(x);
  const PI = Math.PI;

  // Adapted BASIC listing
  let A = 20;  let DX = 0;  let Y;
  for(let YA=17; YA < 179; YA += steps[0]) {
    for(let X=20; X < 300; X += steps[1]) {
      let I = X / 44.4;

      Y = YA - A * eval(formula);

      if(YA >= 19) (Y > 0 && Y < 200) ? addPoint(X + DX, Y) : emitLine();
    }
    DX = 20 * SIN(Y / 25.0);
    if(variant == 1) DX = ABS(DX);

    emitLine();
  };

  return lines;
}

// ---- Plotter ----------------------------------------------------------------

function Plotter(ctx, scale, mode='lines', flipxy=false) {
  this.mode = mode; 
  this.pointSize = scale;
  this.beginLine = () => ctx.beginPath();
  this.endLine = () => ctx.stroke();
  this.pset = function(x, y) { 
    const w=this.pointSize; ctx.fillRect(scale*x-.5*w, scale*y-.5*w, w,w) 
  }
  this.firstPoint = function(x, y) { 
    if(flipxy) [x, y] = [y, x];
    (this.mode=='lines') ? ctx.moveTo(scale*x, scale*y) : this.pset(x, y);
  }
  this.nextPoint = function(x, y) { 
    if(flipxy) [x, y] = [y, x];
    (this.mode=='lines') ? ctx.lineTo(scale*x, scale*y) : this.pset(x, y); 
  }
}

function plot(plotter, lines) {
  lines.forEach( (pts) => {
    plotter.beginLine();
    pts.forEach(([x, y], i) => {
      (i==0) ? plotter.firstPoint(x,y) : plotter.nextPoint(x,y);
    });
    plotter.endLine();
  });
}

// ---- User Interface ---------------------------------------------------------

const canvas = document.querySelector("canvas");

const linesCheckbox = document.querySelector('#lines');
linesCheckbox.addEventListener('change', resize);

const info = document.querySelector('#info');

var currentPlot = 0;
canvas.addEventListener('click', (e) => { 
  let l = (e.clientX - canvas.getBoundingClientRect().left) < (canvas.clientWidth/2);
  currentPlot = Math.abs(currentPlot +  (l ? -1 : +1));
  resize(); 
}, false);

function draw(canvas, scale=1, flipxy=false) {
  var ctx = canvas.getContext('2d');
  ctx.lineWidth = 0.5 * scale;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const generators = [
    () => [calculateOneliner()],
    () => [calculateOneliner(360, 90.2, 2.1)],
    () => [calculateOneliner(400, 179, 3)], // "Super Nova"
    () => [calculateOneliner(200, 46, 1)], // "Höhle links"
    () => [calculateOneliner(300, 170, 1)], // "Sonne"
    () => calculateFantasy(),
    () => calculateFantasy("(1 / COS((I - PI)*(I - PI) - (I==0)))", [3, 1]),
    () => calculateFantasy("SIN(2*I) + TAN(I)"),
    () => calculateFantasy("SIN(2*I) + TAN(I)", [1, 14]),
    () => calculateFantasy("SIN(4*I)", [1, 4], 1),
    () => calculateFantasy("SIN(3*I)", [1, 1], 1),
  ];

  let lines = generators[currentPlot % generators.length]();

  const numPoints = lines.reduce((acc, l) => { return acc + l.length; }, 0)
  const s = (lines.length > 1) ? 's'  : '';
  info.innerHTML = `${lines.length} line${s}, ${numPoints} points`;

  const plotter = new Plotter(ctx, scale, 
                            linesCheckbox.checked ? 'lines' : 'points', flipxy);
  plot(plotter, lines);
}

function resize() {
  var dpr = window.devicePixelRatio;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;

  const portrait = canvas.height > canvas.width;
  const scale = (portrait ? canvas.width : canvas.height) / 400.0;
  draw(canvas, scale, portrait);
}
window.addEventListener('resize', resize, false);
resize();
</script>
</body>
</html>
