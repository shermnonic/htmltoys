<!doctype html>

<head><meta charset="utf-8"/>

<style>
body { text-align: center; }
canvas { width: 100%; max-width: 1280px; aspect-ratio: 640/400; }
</style>
</head>
<body>
<h1>plotter</h1>
<canvas width="640px" height="400px" style="border: 1px solid black"></canvas>
<p><small>See also <a href="oneliner.html">oneliner</a> and <a href="fantasy.html">fantasy</a></small></p>
<script>
function calculateOneliner(a=282, w=168.87, l=6.5) {
  var pts = new Array(a);
  pts[0] = [320, 200];
  for(let i=1; i < a; ++i) {
    const theta = (w * i) * Math.PI / 180.0;
    pts[i] = [ 
      pts[i-1][0] - Math.sin(theta) * l*i,
      pts[i-1][1] - Math.cos(theta) * l*i
    ];
  }
  return pts;
}

function calculateFantasy(formula = "SIN(2*I)") {
  var lines = new Array();
  const scale = (pts, scale) => pts.map(([x, y]) => [x*scale, y*scale]);

  // BASIC wrappers
  const SIN = (x) => Math.sin(x);  const COS = (x) => Math.cos(x);
  const EXP = (x) => Math.exp(x);  const TAN = (x) => Math.tan(x);
  const PI = Math.PI;

  // Adapted BASIC listing
  let A = 20;  let DX = 0;  let Y;
  for(let YA=17; YA < 179; YA+=4) {
    let pts = new Array();

    for(let X=20; X < 300; ++X) {
      let I = X / 44.4;
      Y = YA - A * eval(formula);
      if(YA >= 19 && Y > 0 && Y < 200) {
        pts.push([X + DX, Y]);
      }
    }
    DX = 20 * SIN(Y / 25.0);

    if(pts.length > 0) lines.push(scale(pts, 2)); // scale 320x200 to 640x400
  };

  return lines;
}

function distance(a, b) {
  return Math.sqrt((b[0] - a[0])*(b[0] - a[0]) + (b[1] - a[1])*(b[1] - a[1]));
}

function Plotter(ctx, scale, mode='lines') {
  this.mode = mode; 
  this.pointSize = scale;
  this.beginLine = () => ctx.beginPath();
  this.endLine = () => ctx.stroke();
  this.pset = function(x, y) { 
    const w=this.pointSize; ctx.fillRect(scale*x-.5*w, scale*y-.5*w, w,w) 
  }
  this.firstPoint = function(x, y) { 
    (this.mode=='lines') ? ctx.moveTo(scale*x, scale*y) : this.pset(x, y);
  }
  this.nextPoint = function(x, y) { 
    (this.mode=='lines') ? ctx.lineTo(scale*x, scale*y) : this.pset(x, y); 
  }
}

function plot(plotter, lines) {
  lines.forEach( (pts) => {
    plotter.beginLine();
    pts.forEach(([x, y], i) => {
      (i==0) ? plotter.firstPoint(x,y) : plotter.nextPoint(x,y);
    });
    plotter.endLine();
  });
}

function draw(canvas, dpr=1) {
  const scale = canvas.height / 400.0;
  var ctx = canvas.getContext('2d');
  ctx.lineWidth = 0.5 * scale;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let lines;
  lines = [calculateOneliner()];
  //lines = [calculateOneliner(900, 90.2)];
  //lines = calculateFantasy();
  lines = calculateFantasy("(1 / COS((I - PI)*(I - PI) - (I==0)))");

  var linePlotter = new Plotter(ctx, scale, 'lines');
  plot(linePlotter, lines);

  // var pointPlotter = new Plotter(ctx, scale, 'points');
  // pointPlotter.pointSize *= 2.0;
  // plot(pointPlotter, lines);
}

const canvas = document.querySelector("canvas");

function resize() {
  var dpr = window.devicePixelRatio;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  draw(canvas, dpr);
}
window.addEventListener('resize', resize, false);
resize();
</script>
</body>
</html>
