<!doctype html>
<html lang=en>
<head><meta charset="utf-8"/>
<title>oneliner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<meta name="author" content="386dx25, mnemonic@386dx25.de"/>
<style>
body { text-align: center; }
canvas { width: 100%; max-width: 640px; 
  image-rendering: crisp-edges; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>Graphic Fantasy</h1>
<p>Adaption of "Graphic Fantasy" Basic listing from <a href="https://reader.kultmags.com/Happy%20Computer%201986-07">Happy Computer 7/1986</a>, p.56</p>
<canvas width="320px" height="200px" style="border: 1px solid black"></canvas>
<script>
const canvas = document.querySelector("canvas");
var ctx = canvas.getContext('2d');
const width = canvas.width;
const height = canvas.height;

ctx.clearRect(0,0,canvas.width,canvas.height);

const imageData = ctx.getImageData(0, 0, width, height);
var pixels = new Uint32Array(imageData.data.buffer); // efficient view

function PLOT(x, y) {
  x = Math.floor(x);  y = Math.floor(y);  value = 64;
  pixels[y * width + x] = (255 << 24) | (value << 16) | (value << 8) | value;
}

function SIN(x) { return Math.sin(x); }
function COS(x) { return Math.cos(x); }
function EXP(x) { return Math.exp(x); }
function TAN(x) { return Math.tan(x); }

const PI = Math.PI;

function drawGraphicFantasy() {
  let YA = 17;
  let A = 20;
  let DX = 0;
  let Y;
  while(YA < 179) {
    for(let X=20; X < 300; ++X) {
      let I = X / 44.4;

      //Y = YA - A * SIN(2*I);  // (1)
      //Y = YA - A * SIN((I-PI)*(I-PI));  // (2)
      //Y = YA - A * (.3*SIN(10*I) + .7*SIN(2*I));  // (3)

      //Y = YA - A * (.3*SIN(TAN(I*I)) + .7*SIN(3*I));  // (4)
      //Y = YA - A * SIN(2*I) + TAN(I);  // (5)
      //Y = YA - A * SIN( 1 / SIN(I - (I==0)) ) * SIN(3*I);  // (6)*

      //Y = YA - A * (I - PI) * SIN(4*I);  // (7)
      //Y = YA - A * SIN(5*I) * SIN(EXP(I - PI));  // (8)
      //Y = YA - A * ((I - PI)*(I - PI) * SIN(2*I));  // (9)

      //Y = YA - A * ((I - PI)*(I - PI)*(I - PI) * COS(4*I));  // (10)
      Y = YA - A * (1 / COS((I - PI)*(I - PI) - (I==0)));

      if(A >= 19) {
        if((Y > 0) && (Y < 200)) {
          PLOT(X + DX, Y)
        }
      }
    }

    YA = YA + 4;
    DX = 20 * SIN(Y / 25.0);
  };
}

drawGraphicFantasy();
ctx.putImageData(imageData, 0, 0);
</script>
</body>
</html>
