<!doctype html>
<html>
<head><title>bitart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="386dx25, mnemonic@386dx25.de"/>
<style>
body { text-align: center; }
canvas { width: 100%; max-width: 512px; image-rendering: pixelated; }
.formula { font-family: 'Courier New', Courier, monospace; font-size: 90%; }
@media (prefers-color-scheme: dark) {
  body { color: white; background: #121212; }
  a { color: pink; }
}
</style>
</head>
<body>
<canvas width="256px" height="256px" style="border: 1px solid black"></canvas>
<p class='formula' id="formula"></p>
<p><small><span class='formula' id="original"></span></small></p>
<div id="link"></div>
<script>
const canvas = document.querySelector("canvas");
var ctx = canvas.getContext('2d');

const [width, height] = [canvas.width, canvas.height];

const imageData = ctx.getImageData(0, 0, width, height);
var pixels = new Uint32Array(imageData.data.buffer); // efficient view

function pset(x, y, value) {
  pixels[y * width + x] = (255 << 24) | (value << 16) | (value << 8) | value;
}

function draw(expression) {
  console.time('bitart');
  for(let y=0; y < height; ++y) {
    for(let x=0; x < width; ++x) {
      let value = eval(expression);
      pset(x,y, true ? ((value != 0) ? 255 : 0) : Math.abs(value)<<4);
    }
  }
  console.timeEnd('bitart');
  ctx.putImageData(imageData, 0, 0);  // blit to canvas
}

// Manually simplified bitart bot expressions (or my own if no link given); ensure integer division via `~~`:
const expressions = [ // [expression, link_id, original]
  ['~((-y ^ x ^ 20) | 1) % 6', '116951377322775847', '(~(((-y) ^ (x ^ 20)) | ((y / y) - (x % x)))) % 6'],
  ['( y * (y & 21) % (x ^ (x + 22)) ) % 10', '116950669637011022', '((-((-y) * (y & 21))) % (-((x | x) ^ (x + 22)))) % 10'],  
  ['~~( (x ^ y) / y )', '116950198022348778', '((((x | x) / (x % x)) | (~(y - y))) % (((~y) ^ (-x)) / ((-y) - (y - y)))) % 9'],
    // Note that '~~( (x ^ y) / y )' is not pixel exact but largely accurate simplification of original
  ['(x ^ ~y) % 3', null, null],  ['(x ^ ~y) % 5', null, null],  ['(x ^ ~y) % 6', null, null],  ['(x ^ ~y) % 7', null, null],
  ['(x ^ ~y) % 9', null, null], // trivial patterns for % 1, 2, 4, 8, 16, ...; try shifting x to alleviate center symmetry/diagonal
    // Simplification steps:
    // '((( ~~( x / 0 ) ) | 1) % ( ~~( ((~y) ^ (-x)) / ((-y) - (y - y)) ) )) % 9';
    // '( 1 % ( ~~( ((~y) ^ (-x)) / (-y) ) )) % 9';
    // '( ~~( ((~y) ^ (-x)) / y ) ) % 9';
  ['((x ^ ~y) | 1) % 9', null, null],
  ['((((x + y) ^ (~y)) % (y + x)) * (((3 | y) - (~x)) & (~~(x / 13) - (1 | x)))) % 4', '116749893754526797', null],
  ['(x - (((7 - y) * (y * 6)) - (~~(y / 13) ^ (x + y)))) % 10', '116751309418515014',
      '((((y % y) / (~x)) + (-(-x))) - (((7 - y) * (y * 6)) - ((y / 13) ^ (x + y)))) % 10']
];

// --- UI ---------------------------------------------------------------------

const link_prefix = 'https://mastodon.social/@bitartbot@freeradical.zone/';

function selectExpression(index) {  
  console.log(index)
  const [expression, link_id, original] = expressions[index];

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(link_id) {
    var link = document.createElement('a');
    link.href = link_prefix + link_id;
    link.textContent = '(original bitartbot post)';
    document.getElementById('link').replaceChildren(link);
  } else {
    document.getElementById('link').replaceChildren();
  }

  document.getElementById('formula').textContent = `f(x,y) = ${expression}`;
  document.getElementById('original').textContent = original ? `= ${original}` : '';

  draw(expression);
}

var currentIndex = 0;
selectExpression(currentIndex);

canvas.addEventListener('click', (e) => { 
  let l = (e.clientX - canvas.getBoundingClientRect().left) < (canvas.clientWidth/2);
  currentIndex = (currentIndex + (l ? -1 : +1)) % expressions.length;
  if(currentIndex < 0) currentIndex = expressions.length + currentIndex;
  selectExpression(currentIndex); 
}, false);
</script>
</body>
</html>
